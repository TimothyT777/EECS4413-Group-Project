spring.datasource.url=jdbc:mysql://localhost:3306/PROJECT?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root} //docker variable if it exists, otherwise default to "root"
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root1234} //docker variable if it exists, otherwise default to "Root1234"
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=DEBUG
